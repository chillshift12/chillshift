<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chillshift Admin</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      padding: 30px;
    }

    .box {
      max-width: 500px;
      margin: 50px auto;
      background: #171717;
      padding: 30px;
      border-radius: 18px;
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0 15px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      background: white;
      color: black;
      font-weight: bold;
    }

    #panel {
      display: none;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }

    .logout {
      background: #333;
      color: white;
    }
  </style>
</head>

<body>

<div class="box">

  <!-- LOGIN -->
  <div id="login">

    <h1>Chillshift Admin</h1>

    <p>Owner Login</p>

    <input
      type="email"
      id="email"
      value="chillshift12@gmail.com"
      placeholder="Owner email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button
      type="button"
      onclick="login()"
    >
      LOGIN
    </button>

  </div>


  <!-- ADMIN PANEL -->
  <div id="panel">

    <h1>Upload Song 🎵</h1>

    <input
      type="file"
      id="songFile"
      accept="audio/*"
    >

    <input
      type="text"
      id="title"
      placeholder="Song title"
    >

    <input
      type="text"
      id="artist"
      placeholder="Artist"
    >

    <input
      type="text"
      id="album"
      placeholder="Album"
    >

    <button
      type="button"
      onclick="uploadSong()"
    >
      UPLOAD SONG
    </button>

    <button
      type="button"
      class="logout"
      onclick="logout()"
    >
      LOGOUT
    </button>

  </div>

  <div id="message"></div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("message");


  if (!email || !password) {

    message.textContent =
      "Please enter your password.";

    return;
  }


  message.textContent =
    "Logging in...";


  try {

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      message.textContent =
        "Login failed: " + error.message;

      return;
    }


    if (data.session) {

      message.textContent =
        "✅ Login successful!";

      document.getElementById("login").style.display =
        "none";

      document.getElementById("panel").style.display =
        "block";

    }

  } catch (error) {

    message.textContent =
      "Connection error: " + error.message;

  }

}


async function logout() {

  await supabaseClient.auth.signOut();

  document.getElementById("login").style.display =
    "block";

  document.getElementById("panel").style.display =
    "none";

  document.getElementById("password").value = "";

  document.getElementById("message").textContent =
    "Logged out.";

}

    document.getElementById("artist").value.trim();

  const album =
    document.getElementById("album").value.trim();


  if (!file) {

    document.getElementById("message").textContent =
      "Please select an MP3 file.";
